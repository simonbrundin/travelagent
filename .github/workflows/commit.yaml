name: CI - Build and Publish
on:
  push:
    branches:
      - main
    paths:
      - src/nuxt/**
      - .github/workflows/**
      - Dockerfile
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/travelagent

jobs:
  build-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: |
          echo "::notice title=Image Built::${{ steps.meta.outputs.tags }}"

    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha-${{ github.sha }}
      tags: ${{ steps.meta.outputs.tags }}

  update-deployment:
    needs: build-publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main

      - name: Install yq
        run: |
          YQ_URL="https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64"
          wget -q "$YQ_URL" -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update deployment image
        env:
          IMAGE: ${{ needs.build-publish-image.outputs.image }}
        run: |
          echo "Updating image to: $IMAGE"
          yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' \
            environments/prod/deployment.yaml

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add environments/prod/deployment.yaml
          git commit -m "chore: update travelagent image [skip ci]" || exit 0
          git push
